x-server-base: &server-base
  image: payment:latest
  command: payment server
  environment: &server-env
    CONFIG_PATH: /app/config/config.docker.yaml
  volumes: &config-volume
    - ./config:/app/config:ro
  networks: &payment-net
    - payment-net

x-client-base: &client-base
  image: payment:latest
  command: payment client
  environment: &client-env
    CONFIG_PATH: /app/config/config.docker.yaml
  volumes: *config-volume
  networks: *payment-net
  depends_on: &server-deps
    - server-0
    - server-1
    - server-2
    - server-3
    - server-4

services:
  server-0:
    <<: *server-base
    build: .
    environment:
      <<: *server-env
      SERVER_ID: "server-0"
      KEY_SHARE_PATH: /app/config/share_0.bin

  server-1:
    <<: *server-base
    environment:
      <<: *server-env
      SERVER_ID: "server-1"
      KEY_SHARE_PATH: /app/config/share_1.bin
    depends_on:
      - server-0

  server-2:
    <<: *server-base
    environment:
      <<: *server-env
      SERVER_ID: "server-2"
      KEY_SHARE_PATH: /app/config/share_2.bin
    depends_on:
      - server-0

  server-3:
    <<: *server-base
    environment:
      <<: *server-env
      SERVER_ID: "server-3"
      KEY_SHARE_PATH: /app/config/share_3.bin
    depends_on:
      - server-0

  server-4:
    <<: *server-base
    environment:
      <<: *server-env
      SERVER_ID: "server-4"
      KEY_SHARE_PATH: /app/config/share_4.bin
    depends_on:
      - server-0

  client-0:
    <<: *client-base
    environment:
      <<: *client-env
      CLIENT_ID: "client-0"
      PORT: "9000"
    ports:
      - "9000:9000"

  client-1:
    <<: *client-base
    environment:
      <<: *client-env
      CLIENT_ID: "client-1"
      PORT: "9001"
    ports:
      - "9001:9001"

  client-2:
    <<: *client-base
    environment:
      <<: *client-env
      CLIENT_ID: "client-2"
      PORT: "9002"
    ports:
      - "9002:9002"

  client-3:
    <<: *client-base
    environment:
      <<: *client-env
      CLIENT_ID: "client-3"
      PORT: "9003"
    ports:
      - "9003:9003"

  client-4:
    <<: *client-base
    environment:
      <<: *client-env
      CLIENT_ID: "client-4"
      PORT: "9004"
    ports:
      - "9004:9004"

networks:
  payment-net:
